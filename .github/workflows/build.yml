name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sélectionner Xcode 26 (Swift 6.2)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      - name: Installer les dépendances
        run: |
          npm install
          npx expo install --fix --npm
          npm ls expo-modules-jsi expo-modules-core

      - name: Corriger les erreurs Swift de ExpoModulesJSI
        run: |
          python3 - <<'PYFIX'
          from pathlib import Path
          root = Path('node_modules/expo-modules-jsi/apple/Sources')
          if not root.exists():
              raise SystemExit('expo-modules-jsi introuvable')
          changed = 0
          for path in root.rglob('*.swift'):
              text = path.read_text()
              fixed = text.replace('weak let ', 'weak var ')
              if fixed != text:
                  path.write_text(fixed)
                  changed += 1
          header = root / 'ExpoModulesJSI-Cxx/include/RuntimeScheduler.h'
          if header.exists():
              text = header.read_text()
              fixed = text.replace('SWIFT_RETURNS_RETAINED RuntimeScheduler(', 'RuntimeScheduler(')
              if fixed != text:
                  header.write_text(fixed)
                  changed += 1
          # Swift 6: les classes avec une référence weak mutable doivent
          # déclarer explicitement leur conformité Sendable comme non vérifiée.
          import re
          targets = {
              'JavaScriptPropNameID.swift': 'JavaScriptPropNameID',
              'JavaScriptError.swift': 'JavaScriptError',
              'JavaScriptValue.swift': 'JavaScriptValue',
          }
          for filename, classname in targets.items():
              matches = list(root.rglob(filename))
              if len(matches) != 1:
                  raise SystemExit(f'Fichier attendu introuvable ou ambigu: {filename}')
              path = matches[0]
              original = path.read_text()
              # Ne modifie que la déclaration de la classe ciblée.
              pattern = rf'(\bclass\s+{classname}\b[^{{\n]*?:[^{{\n]*?)\bSendable\b'
              updated, count = re.subn(pattern, lambda m: m.group(1) + '@unchecked Sendable', original, count=1)
              if count != 1:
                  raise SystemExit(f'Conformité Sendable non trouvée pour {classname}: vérifier le code Expo installé')
              path.write_text(updated)
              changed += 1
          print(f'Fichiers adaptes: {changed}')
          PYFIX

      - name: Générer le projet iOS
        run: npx expo prebuild --platform ios

      - name: Compiler (sans signature)
        working-directory: ios
        run: |
          WS=$(ls -d *.xcworkspace | head -n 1)
          SCHEME="${WS%.xcworkspace}"
          xcodebuild -quiet -workspace "$WS" -scheme "$SCHEME" \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Préparer IPA sans modifier les frameworks
        working-directory: ios
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -type d -name "*.app" -print -quit)
          test -n "$APP"
          mkdir -p Payload
          ditto "$APP" "Payload/$(basename "$APP")"
          ditto -c -k --sequesterRsrc --keepParent Payload ../VoteSNKMC.ipa
          unzip -t ../VoteSNKMC.ipa | tail -n 1

      - uses: actions/upload-artifact@v4
        with:
          name: VoteSNKMC-ipa
          path: VoteSNKMC.ipa
